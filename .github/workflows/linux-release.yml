name: Linux Release

on:
  push:
    branches:
      - fork/linux-updater
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils \
            libasound2-dev

      - name: Validate signing secret
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_B64}" ]; then
            echo "Missing TAURI_SIGNING_PRIVATE_KEY_B64 secret."
            exit 1
          fi

      - name: Derive fork release version
        id: version
        env:
          REPOSITORY: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          data = json.loads(Path("src-tauri/tauri.conf.json").read_text())
          source_version = data["version"]
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", source_version)
          if not match:
              raise SystemExit(
                  f"Expected upstream base version in src-tauri/tauri.conf.json, got {source_version!r}"
              )

          major, minor, patch = map(int, match.groups())
          fork_base = f"{major}.{minor}.{patch + 1}"
          fork_prefix = f"v{fork_base}-fork."

          tags_on_head = subprocess.check_output(
              ["git", "tag", "--points-at", os.environ["CURRENT_SHA"]],
              text=True,
          ).splitlines()
          existing_tag = next((tag for tag in tags_on_head if tag.startswith(fork_prefix)), None)
          if existing_tag is not None:
              release_version = existing_tag.removeprefix("v")
          else:
              raw = subprocess.check_output(
                  [
                      "gh",
                      "release",
                      "list",
                      "--repo",
                      os.environ["REPOSITORY"],
                      "--limit",
                      "100",
                      "--json",
                      "tagName",
                  ],
                  text=True,
              )
              releases = json.loads(raw)
              suffixes = []
              for release in releases:
                  tag = release["tagName"]
                  if tag.startswith(fork_prefix):
                      suffix = tag.removeprefix(fork_prefix)
                      if suffix.isdigit():
                          suffixes.append(int(suffix))
              next_suffix = max(suffixes, default=0) + 1
              release_version = f"{fork_base}-fork.{next_suffix}"

          github_output = Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as fh:
              fh.write(f"source_version={source_version}\n")
              fh.write(f"release_version={release_version}\n")
          print(f"Upstream base version: {source_version}")
          print(f"Fork release version: {release_version}")
          PY

      - name: Stamp fork release version into build metadata
        env:
          SOURCE_VERSION: ${{ steps.version.outputs.source_version }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source_version = os.environ["SOURCE_VERSION"]
          release_version = os.environ["RELEASE_VERSION"]

          json_paths = [
              Path("package.json"),
              Path("package-lock.json"),
              Path("src-tauri/tauri.conf.json"),
          ]
          for path in json_paths:
              data = json.loads(path.read_text())
              if path.name == "package-lock.json":
                  if data.get("version") == source_version:
                      data["version"] = release_version
                  root_package = data.get("packages", {}).get("")
                  if isinstance(root_package, dict) and root_package.get("version") == source_version:
                      root_package["version"] = release_version
              else:
                  if data.get("version") == source_version:
                      data["version"] = release_version
              path.write_text(json.dumps(data, indent=2) + "\n")

          cargo_path = Path("src-tauri/Cargo.toml")
          cargo_text = cargo_path.read_text()
          old = f'version = "{source_version}"'
          new = f'version = "{release_version}"'
          if old not in cargo_text:
              raise SystemExit(f"Could not find {old!r} in {cargo_path}")
          cargo_path.write_text(cargo_text.replace(old, new, 1))
          PY

      - name: Install frontend dependencies
        run: npm ci

      - name: Write Tauri signing key
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.tauri"
          echo "$TAURI_SIGNING_PRIVATE_KEY_B64" | base64 --decode > "$HOME/.tauri/codexmonitor.key"

      - name: Build signed AppImage
        run: |
          set -euo pipefail
          export TAURI_SIGNING_PRIVATE_KEY
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$HOME/.tauri/codexmonitor.key")"
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" ]; then
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          npm run tauri -- build --bundles appimage

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          mapfile -t appimages < <(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | sort)
          if [ ${#appimages[@]} -eq 0 ]; then
            echo "No AppImage output found"
            exit 1
          fi

          appimage="${appimages[0]}"
          sig="${appimage}.sig"
          if [ ! -f "$sig" ]; then
            echo "Missing updater signature for ${appimage}"
            exit 1
          fi

          cp "$appimage" release-artifacts/
          cp "$sig" release-artifacts/

          while IFS= read -r -d '' artifact; do
            dir=$(dirname "$artifact")
            file=$(basename "$artifact")
            normalized="${file// /.}"
            if [ "$file" != "$normalized" ]; then
              mv "$artifact" "${dir}/${normalized}"
            fi
          done < <(find release-artifacts -type f -print0)

          pushd release-artifacts >/dev/null
          sha256sum *.AppImage > SHA256SUMS.txt
          popd >/dev/null

      - name: Generate release notes
        env:
          SOURCE_VERSION: ${{ steps.version.outputs.source_version }}
        run: |
          set -euo pipefail
          upstream_tag="v${SOURCE_VERSION}"
          echo "Based on upstream ${upstream_tag}." > release-artifacts/release-notes.md
          echo "" >> release-artifacts/release-notes.md
          tag=$(git tag --points-at "${GITHUB_SHA}" | grep -- '-fork\.' | head -n 1 || true)
          if [ -z "${tag}" ]; then
            tag="v${{ steps.version.outputs.release_version }}"
          fi
          last_tag=$(git tag --sort=-version:refname | grep -v "^${tag}$" | head -n 1 || true)
          if [ -n "${last_tag}" ]; then
            git log "${last_tag}..${GITHUB_SHA}" --pretty=format:"- %s" >> release-artifacts/release-notes.md
          else
            git log "${GITHUB_SHA}" --pretty=format:"- %s" >> release-artifacts/release-notes.md
          fi
          if [ ! -s release-artifacts/release-notes.md ]; then
            echo "- Linux AppImage fork release." > release-artifacts/release-notes.md
          fi

      - name: Build latest.json
        env:
          VERSION: ${{ steps.version.outputs.release_version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          import os
          from pathlib import Path
          from urllib.parse import quote

          artifacts_dir = Path("release-artifacts")
          appimages = sorted(artifacts_dir.glob("*.AppImage"))
          if not appimages:
            raise SystemExit("No AppImage artifact found")
          appimage = appimages[0]
          sig_path = Path(f"{appimage}.sig")
          if not sig_path.exists():
            raise SystemExit(f"Missing signature for {appimage.name}")

          notes = (artifacts_dir / "release-notes.md").read_text().strip()
          payload = {
            "version": os.environ["VERSION"],
            "notes": notes or "Linux AppImage fork release.",
            "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "platforms": {
              "linux-x86_64": {
                "url": f"https://github.com/{os.environ['REPOSITORY']}/releases/download/v{os.environ['VERSION']}/{quote(appimage.name)}",
                "signature": sig_path.read_text().strip(),
              }
            },
          }
          (artifacts_dir / "latest.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY

      - name: Create or update GitHub release
        env:
          VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "$tag" \
              --notes-file release-artifacts/release-notes.md
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes-file release-artifacts/release-notes.md \
              --target "$GITHUB_SHA"
          fi

      - name: Upload release assets
        env:
          VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          gh release upload "$tag" \
            release-artifacts/*.AppImage \
            release-artifacts/*.sig \
            release-artifacts/SHA256SUMS.txt \
            release-artifacts/latest.json \
            --clobber
